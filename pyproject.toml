[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsc-host"
version = "0.0.1"
description = "Robot Study Companion host service. Bridges on-chassis peripherals to LAN clients over an authenticated WebSocket."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Robot Study Companion contributors" }]
keywords = ["robotics", "raspberry-pi", "websocket", "rsc"]

# Imported unconditionally somewhere in the package, so the daemon will not
# start without them.
dependencies = [
    "websockets>=13",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Everything here is imported inside a try block. Absent, the daemon logs what
# it lost and carries on, so a laptop install needs none of it.
serial = ["pyserial-asyncio>=0.6"]   # CYD front panel
discovery = ["zeroconf>=0.132"]      # mDNS service advertisement
dsp = ["scipy>=1.11"]                # Butterworth high-pass; a numpy-only
                                     # moving-average filter is used otherwise
aec = ["speexdsp>=0.1"]              # echo canceller, scaffolded not implemented

# Raspberry Pi hardware. Install with --system-site-packages so the distro
# packages (python3-lgpio, python3-gpiozero) are visible; several of these are
# easier to get from apt than from pip on a Pi.
#
# NOTE: pigpio is deliberately absent. A malformed pigpiod unit caused the
# timing failures once blamed on the hardware, and reintroducing the package
# invites someone to enable it again. See docs/pi-setup.md#why-not-pigpio.
pi = [
    "lgpio>=0.2",
    "gpiozero>=2.0",
    "rsc-host[serial,discovery]",
]

# The LED ring helper runs as a separate root process and may use a different
# interpreter from the daemon, so these are split out rather than bundled into
# [pi].
ring = [
    "rpi_ws281x>=5.0.0",
    "adafruit-circuitpython-neopixel>=6.3",
    "adafruit-blinka>=8.20",
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
rsc-host = "rsc_host.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["rsc_host"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true